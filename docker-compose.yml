version: "3.9"

services:
  db:
    image: postgres:16
    container_name: smart_fridge_db
    restart: always
    environment:
      POSTGRES_DB: smart_fridge
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: smart_fridge_redis
    restart: always
    ports:
      - "6379:6379"

  web:
    build: .
    container_name: smart_fridge_web
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
      - redis

  celery:
    build: .
    container_name: smart_fridge_celery
    command: celery -A config worker --loglevel=info
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - db
      - redis

volumes:
  postgres_data: